<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Portal</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        p.subtitle { color: #888; margin-bottom: 30px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            background-color: #2a2a2a;
            border-color: #ff66aa;
        }
        .card h3 { margin: 10px 0 5px 0; }
        .card p { font-size: 0.85em; color: #aaa; }
    </style>
</head>
<body>

    <h1>Math Practice Hub</h1>
    <p class="subtitle">Select an interactive module to begin</p>

    <div class="grid">
        <!-- WebOsu Link -->
        <a href="./Webosu/index.html" class="card">
            <h3>osu! Web</h3>
            <p>Rhythm & precision trainer</p>
        </a>

        <!-- Single-file HTML Game 1 -->
        <a href="./games/EaglercraftX_1.8_WASM-GC_Offline_Download.html" class="card">
            <h3>Minecraft</h3>
            <p>I am placing blocks and shit cuz i'm in fucking minecraft.</p>
        </a>

        <!-- Single-file HTML Game 2 -->
        <a href="./games/stickfighter.html" class="card">
            <h3>Stick Fighter</h3>
            <p>Basically Mortal Kombat with sticks.</p>
        </a>
    </div>

</body>
</html>
